name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.json', '**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      if: steps.composer-cache.outputs.cache-hit != 'true'
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run test suite
      env:
        TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
      run: composer run-script test

    - name: Run linter
      run: composer run-script lint

  coverage:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install PHP with pcov
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: pcov

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.json', '**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run tests with 80% line coverage gate
      env:
        TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
      run: make cover

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          coverage/coverage-badge.json
          coverage/coverage-summary.json
          coverage/cobertura.xml

  test:
    needs: build
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macOS-latest]
        # See: https://www.php.net/supported-versions
        php-versions: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]
    continue-on-error: true

    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Run test suite
      env:
        TEST_CONFIGURATION_ACCESS_TOKEN: ${{ secrets.TEST_CONFIGURATION_ACCESS_TOKEN }}
      run: |
        composer run-script test
        chmod +x scripts/*
        ./scripts/run_snippets.sh

  publish-coverage:
    name: Publish coverage
    needs: coverage
    # Only pushes to the default branch publish, and only once the GitHub App for
    # the test-coverage repository is configured (COVERAGE_APP_ID variable).
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.COVERAGE_APP_ID != ''
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8
      with:
        name: coverage
        path: coverage
    - name: Get a token for the test-coverage repository
      id: coverage-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ vars.COVERAGE_APP_ID }}
        private-key: ${{ secrets.COVERAGE_APP_PRIVATE_KEY }}
        owner: aspose-barcode-cloud
        repositories: test-coverage
        permission-contents: write
    - name: Publish to test-coverage
      run: python scripts/publish-coverage.py php
      env:
        COVERAGE_TOKEN: ${{ steps.coverage-token.outputs.token }}
        COVERAGE_APP_SLUG: ${{ steps.coverage-token.outputs.app-slug }}
